name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # Full history: the sitemap's lastmod is the design file's last commit
          # date, and a shallow clone cannot resolve it.
          fetch-depth: 0

      # Rebuild rather than trusting the committed public/ directory: if the
      # design was edited without re-running the build, this is where it fails,
      # instead of publishing a page that no longer matches its source.
      - name: Build site
        run: python3 scripts/build.py

      - name: Fail if the build output was stale
        run: |
          if ! git diff --quiet -- public/; then
            echo "::error::public/ is out of date with design/ — run 'python3 scripts/build.py' and commit the result."
            git --no-pager diff --stat -- public/
            exit 1
          fi

      - name: Deploy production site
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=learn-terraform --branch=main --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
